name: Release CLI

# Builds the gx CLI + gx-mcp for darwin/linux and attaches the archives, with
# their checksums, to the GitHub release for a v* tag. There is no download
# site: a release is these assets, and everyone else builds from source.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and release the gx CLI
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA:0:12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build CLI packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          GOOS=darwin GOARCH=arm64 BUN_TARGET=bun-darwin-arm64 scripts/package-cli.sh
          GOOS=darwin GOARCH=amd64 BUN_TARGET=bun-darwin-x64 scripts/package-cli.sh
          GOOS=linux GOARCH=arm64 BUN_TARGET=bun-linux-arm64 scripts/package-cli.sh
          GOOS=linux GOARCH=amd64 BUN_TARGET=bun-linux-x64 scripts/package-cli.sh

      - name: Verify artifacts
        run: |
          for platform in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            test -f "dist/cli/gx_${{ steps.version.outputs.version }}_${platform}.tar.gz"
            test -f "dist/cli/gx_${{ steps.version.outputs.version }}_${platform}.tar.gz.sha256"
          done

      - name: Publish GitHub release assets
        if: ${{ github.ref_type == 'tag' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          assets=(dist/cli/gx_*.tar.gz dist/cli/gx_*.tar.gz.sha256)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$tag" --generate-notes
          fi
