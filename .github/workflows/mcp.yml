name: mcp

# Tests the MCP package on pushes and PRs.
#
# There is no publish job and no registry. gx-mcp is compiled by
# scripts/package-cli.sh and ships inside the CLI tarball that install.sh
# installs, and `gx init` registers it by absolute path — so nothing in gx
# needs a package registry to resolve the MCP server.

on:
  push:
    branches: [main]
    pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:xmcp
      - run: bun test
